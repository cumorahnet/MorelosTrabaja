<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Publicar anuncio | Morelos Trabaja</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
</head>
<body class="bg-slate-50 min-h-screen font-sans">
    <main class="max-w-xl mx-auto px-6 py-12">
        <a href="index.html" class="text-blue-700 font-bold">← Volver a los anuncios</a>
        <section class="bg-white rounded-3xl shadow-lg p-8 mt-6">
            <h1 class="text-3xl font-black text-blue-900">Publica gratis</h1>
            <p class="text-slate-500 mt-2 mb-8">Comparte una oportunidad con la comunidad de Morelos.</p>
            <form id="form-anuncio" class="space-y-5">
                <label class="block font-bold text-slate-700">Categoría
                    <select name="categoria" required class="mt-2 w-full border rounded-xl p-3 bg-white">
                        <option value="empleo">Empleo</option>
                        <option value="servicios">Servicios</option>
                        <option value="ventas">Ventas</option>
                    </select>
                </label>
                <label class="block font-bold text-slate-700">Título
                    <input name="titulo" required minlength="4" maxlength="80" class="mt-2 w-full border rounded-xl p-3" autocomplete="off">
                </label>
                <label class="block font-bold text-slate-700">Descripción
                    <textarea name="descripcion" required minlength="10" maxlength="500" rows="5" class="mt-2 w-full border rounded-xl p-3"></textarea>
                </label>
                <p class="rounded-xl bg-blue-50 p-4 text-sm font-bold text-blue-800">El anuncio usará automáticamente el WhatsApp registrado en tu perfil.</p>
                <div id="employment-fields" class="space-y-5">
                    <label class="block font-bold text-slate-700">Prestaciones
                        <textarea name="prestaciones" required minlength="3" maxlength="300" rows="3" class="mt-2 w-full border rounded-xl p-3" placeholder="Ej: Seguro social, aguinaldo, vacaciones y bonos"></textarea>
                    </label>
                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                        <label class="block font-bold text-slate-700">Sueldo mínimo ($ MXN)
                            <input name="sueldo_minimo" type="number" required min="0" max="10000000" step="1" class="mt-2 w-full border rounded-xl p-3">
                        </label>
                        <label class="block font-bold text-slate-700">Sueldo máximo ($ MXN)
                            <input name="sueldo_maximo" type="number" required min="0" max="10000000" step="1" class="mt-2 w-full border rounded-xl p-3">
                        </label>
                    </div>
                    <label class="block font-bold text-slate-700">Periodo del sueldo
                        <select name="periodo_sueldo" required class="mt-2 w-full border rounded-xl p-3 bg-white">
                            <option value="">Selecciona</option>
                            <option value="hora">Por hora</option>
                            <option value="dia">Por día</option>
                            <option value="semana">Por semana</option>
                            <option value="quincena">Por quincena</option>
                            <option value="mes">Por mes</option>
                        </select>
                    </label>
                </div>
                <button id="enviar" disabled class="w-full bg-red-600 hover:bg-red-700 disabled:opacity-60 text-white rounded-xl p-4 font-black" type="submit">COMPROBANDO SESIÓN...</button>
                <p id="estado" role="status" aria-live="polite" class="text-sm font-bold"></p>
            </form>
        </section>
    </main>
    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyBMDAS5Uqig7NzaHP3h2huzRL30Uo5t7rM",
            authDomain: "morelos-trabaja.firebaseapp.com",
            projectId: "morelos-trabaja",
            storageBucket: "morelos-trabaja.firebasestorage.app",
            messagingSenderId: "506981339593",
            appId: "1:506981339593:web:266f12812305d1a92d1818"
        };

        firebase.initializeApp(firebaseConfig);
        const form = document.getElementById('form-anuncio');
        const estado = document.getElementById('estado');
        const enviar = document.getElementById('enviar');
        const auth = firebase.auth();
        const categoryInput = form.elements.categoria;
        const employmentFields = document.getElementById('employment-fields');
        let authenticatedUser = null;
        let authenticatedWhatsapp = '';

        function updateEmploymentFields() {
            const employmentSelected = categoryInput.value === 'empleo';
            employmentFields.classList.toggle('hidden', !employmentSelected);
            employmentFields.querySelectorAll('input, textarea, select').forEach(input => {
                input.disabled = !employmentSelected;
                input.required = employmentSelected;
            });
        }

        categoryInput.addEventListener('change', updateEmploymentFields);
        updateEmploymentFields();

        // Intentar autenticación anónima en carga para permitir creaciones seguras
        const unsubscribeAuth = auth.onAuthStateChanged(async user => {
            if (!user || user.isAnonymous) {
                authenticatedUser = null;
                estado.textContent = 'Necesitas iniciar sesión para publicar. Redirigiendo...';
                estado.className = 'text-sm font-bold text-blue-700';
                if (user?.isAnonymous) {
                    try { await auth.signOut(); }
                    catch (error) { console.error('No se pudo cerrar la sesión anónima:', error.code); }
                }
                window.location.replace('index.html');
                return;
            }
            authenticatedUser = user;
            try {
                const profile = await firebase.firestore().collection('usuarios').doc(user.uid).get();
                authenticatedWhatsapp = String(profile.get('whatsappContacto') || '').replace(/\D/g, '');
                if (!/^\d{10,15}$/.test(authenticatedWhatsapp) || profile.get('terminosAceptados') !== true) {
                    estado.textContent = 'Completa tu perfil y acepta los términos en la página principal.';
                    estado.className = 'text-sm font-bold text-blue-700';
                    window.location.replace('index.html');
                    return;
                }
            } catch (error) {
                console.error('No se pudo cargar el perfil:', error);
                window.location.replace('index.html');
                return;
            }
            enviar.disabled = false;
            enviar.textContent = 'PUBLICAR ANUNCIO';
        });
        window.addEventListener('pagehide', unsubscribeAuth, { once: true });

        form.addEventListener('submit', async event => {
            event.preventDefault();
            if (!form.reportValidity()) return;
            if (!authenticatedUser) {
                estado.textContent = 'Tu sesión no está disponible. Inicia sesión nuevamente.';
                estado.className = 'text-sm font-bold text-red-700';
                return;
            }

            const values = new FormData(form);
            const whatsapp = authenticatedWhatsapp;
            if (!/^\d{10,15}$/.test(whatsapp)) {
                estado.textContent = 'Escribe un número de WhatsApp válido, con lada.';
                estado.className = 'text-sm font-bold text-red-700';
                return;
            }
            const category = String(values.get('categoria'));
            const salaryMinimum = Number(values.get('sueldo_minimo'));
            const salaryMaximum = Number(values.get('sueldo_maximo'));
            if (category === 'empleo' && (!Number.isFinite(salaryMinimum) || !Number.isFinite(salaryMaximum) || salaryMinimum < 0 || salaryMaximum < salaryMinimum)) {
                estado.textContent = 'El sueldo máximo debe ser igual o mayor que el sueldo mínimo.';
                estado.className = 'text-sm font-bold text-red-700';
                return;
            }

            enviar.disabled = true;
            estado.textContent = 'Publicando…';
            estado.className = 'text-sm font-bold text-slate-500';

            try {
                const ad = {
                    categoria: category,
                    titulo: String(values.get('titulo')).trim(),
                    descripcion: String(values.get('descripcion')).trim(),
                    whatsapp,
                    authorUid: authenticatedUser.uid,
                    fecha: firebase.firestore.FieldValue.serverTimestamp(),
                    expiresAt: firebase.firestore.Timestamp.fromMillis(Date.now() + (8 * 24 * 60 * 60 * 1000)),
                    estado: 'activo'
                };
                if (category === 'empleo') {
                    Object.assign(ad, {
                        prestaciones: String(values.get('prestaciones')).trim(),
                        sueldo_minimo: salaryMinimum,
                        sueldo_maximo: salaryMaximum,
                        periodo_sueldo: String(values.get('periodo_sueldo'))
                    });
                }
                await firebase.firestore().collection('anuncios').add(ad);
                form.reset();
                updateEmploymentFields();
                estado.textContent = 'Anuncio publicado. Ya puedes verlo en la página principal.';
                estado.className = 'text-sm font-bold text-green-700';
            } catch (error) {
                console.error('No se pudo publicar el anuncio:', error);
                estado.textContent = 'No fue posible publicar. Revisa los permisos de Firestore e inténtalo nuevamente.';
                estado.className = 'text-sm font-bold text-red-700';
            } finally {
                enviar.disabled = false;
            }
        });
    </script>
</body>
</html>
